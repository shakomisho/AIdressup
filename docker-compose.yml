# Local stack. `docker compose up --build` then open http://localhost:3000
#
# NOTE: browsers only grant getUserMedia on a secure context. http://localhost
# counts as secure, so the webcam works out of the box — but reaching the app
# from another machine over plain http will not prompt for the camera.

services:
  backend:
    build:
      context: ./backend
    container_name: tryon-backend
    environment:
      TRYON_ENVIRONMENT: development
      TRYON_DEFAULT_ENGINE: overlay
      TRYON_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    volumes:
      - ./assets/clothes:/data/clothes
      - ./models:/models:ro
      - tryon-data:/data
    ports:
      - '8000:8000'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tryon-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - '3000:3000'
    restart: unless-stopped

  # Optional: swap SQLite for Postgres.
  #   docker compose --profile postgres up -d postgres
  #   TRYON_DATABASE_URL=postgresql+psycopg://tryon:tryon@postgres:5432/tryon
  postgres:
    image: postgres:17-alpine
    container_name: tryon-postgres
    profiles: ['postgres']
    environment:
      POSTGRES_USER: tryon
      POSTGRES_PASSWORD: tryon
      POSTGRES_DB: tryon
    volumes:
      - tryon-postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tryon']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tryon-data:
  tryon-postgres:
