# Reverse proxy for hosting the app on a LAN box (e.g. blackwall) while the
# camera runs on a laptop.
#
# Why this file exists: browsers grant getUserMedia only on a secure context —
# https, or localhost. Reaching the app over plain http from another machine
# gets the camera silently refused, with no permission prompt. Terminating TLS
# here is what makes a remote webcam work at all.
#
# Install:  sudo cp deploy/nginx.conf /etc/nginx/conf.d/tryon.conf
#           sudo nginx -t && sudo systemctl reload nginx

upstream tryon_frontend {
    server 127.0.0.1:3000;
}

# Next.js already proxies /api, /assets/clothes and /outputs through to the
# backend (see frontend/next.config.mjs), so the browser sees a single origin —
# no CORS, no tainted canvas. Everything below therefore goes to Next.
upstream tryon_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    # Adjust to your hostname.
    server_name blackwall blackwall.lan;
    # Plain http can never grant the camera; send everything to TLS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name blackwall blackwall.lan;

    ssl_certificate     /etc/nginx/certs/blackwall.pem;
    ssl_certificate_key /etc/nginx/certs/blackwall-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Snapshots and person frames are posted as base64 PNGs. The backend allows
    # TRYON_MAX_UPLOAD_MB (default 12), and nginx's own default is 1m — leave
    # this unset and uploads fail with 413 before they ever reach FastAPI.
    client_max_body_size 16m;

    location / {
        proxy_pass http://tryon_frontend;
        proxy_http_version 1.1;

        # Next needs the websocket upgrade for HMR in dev and for RSC streaming.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Try-on requests for queued engines return 202 immediately and the
        # client polls, so no response is ever held open for the length of an
        # inference. The default 60s read timeout is plenty (see ADR-0001).
        proxy_read_timeout 90s;
    }

    # Optional: serve garment PNGs and generated outputs straight from FastAPI
    # instead of double-proxying them through Next. Saves a hop; only worth it
    # if you notice the catalog thumbnails loading slowly.
    #
    # location ~ ^/(assets/clothes|outputs)/ {
    #     proxy_pass http://tryon_backend;
    #     proxy_set_header Host $host;
    #     expires 1h;
    # }
}
